name: CI Frontend Ndewa360

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      # Le build de production applique aussi les budgets de taille
      # (angular.json) : un bundle initial au-delà de 3,6 Mo fait échouer la CI.
      - name: Build
        run: npx ng build --configuration=production

      - name: Audit des dépendances (production)
        run: npm audit --omit=dev --audit-level=critical
