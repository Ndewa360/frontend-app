<app-landing-header></app-landing-header>

<div class="app-a-box app-scrollbar-fix pb-2 mt-16">
    <ng-scrollbar track="vertical">
        <router-outlet></router-outlet>
        <app-landing-footer></app-landing-footer>
    </ng-scrollbar>
</div>

<div class="cookie-banner" *ngIf="cookieBannerVisible">
  <div class="cookie-banner__content">
    <span class="cookie-banner__icon"><i class="fas fa-cookie-bite"></i></span>
    <p>
      {{ 'COOKIE_BANNER.MESSAGE' | translate }}
      <a [routerLink]="['/', lang, 'home', 'cookies']">{{ 'COOKIE_BANNER.POLICY_LINK' | translate }}</a>.
    </p>
  </div>
  <div class="cookie-banner__actions">
    <button class="cookie-btn cookie-btn--decline" (click)="declineCookies()">{{ 'COOKIE_BANNER.DECLINE' | translate }}</button>
    <button class="cookie-btn cookie-btn--accept" (click)="acceptCookies()">{{ 'COOKIE_BANNER.ACCEPT' | translate }}</button>
  </div>
</div>

<div class="cookie-banner cookie-banner--minimal" *ngIf="!cookieBannerVisible">
  <button class="cookie-btn cookie-btn--prefs" (click)="resetCookieChoice()">
    <i class="fas fa-cookie-bite"></i> {{ 'COOKIE_BANNER.PREFERENCES' | translate }}
  </button>
</div>
