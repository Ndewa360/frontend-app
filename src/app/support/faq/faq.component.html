<div class="app-a-box app-scrollbar-fix">
  <ng-scrollbar>
    <div fxLayout="row" fxLayoutAlign="center start">
      <div fxFlex="100%" fxFlex.gt-md="80%" fxFlex.gt-lg="70%" class="app-content app-content--default">
        <div class="mt-8 mb-4" (click)="goBack()">
          <youpez-logo class="cursor-pointer" logoWidth="200px"></youpez-logo>
        </div>
        <div class="">
          <button (click)="goBack()" ibmButton="ghost" size="sm" class="cds--btn__icon--left -ml-2">
            <youpez-ibm-icon iconName="arrowLeft" iconClass="cds--btn__icon" size="20"></youpez-ibm-icon>
            {{ 'SUPPORT.FAQ.BACK_TO_HOME' | translate }}
          </button>
        </div>
        <h1 class="app-productive-heading-06 mb-8">
          {{ 'SUPPORT.FAQ.TITLE' | translate }}
        </h1>
        <section *ngFor="let group of faq" class="faq-group" [attr.id]="group.id">
          <h2 class="faq-group__title">{{ group.groupName }}</h2>
          <div class="faq-group__list">
            <details *ngFor="let question of group.children" class="faq-item" [attr.id]="question.id">
              <summary class="faq-item__question">{{ question.title }}</summary>
              <div class="faq-item__answer" [innerHTML]="question.content"></div>
            </details>
          </div>
        </section>
      </div>
    </div>
  </ng-scrollbar>
</div>
